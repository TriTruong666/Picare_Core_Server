name: Deploy Picare Core Hub Service

on:
  push:
    branches:
      - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Kiểm tra xem code của OCR có thay đổi không
      - name: Check for changes in OCR service
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            ocr:
              - 'services/core_ocr/**'

      # --- BƯỚC QUAN TRỌNG ĐỂ FIX LỖI CACHE ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container # Thiết lập driver hỗ trợ cache gha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/tritruong666/picare-hub-server:latest
          # Bây giờ các dòng cache này sẽ chạy mượt mà
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CHỈ BUILD & TEST OCR KHI CÓ THAY ĐỔI TRONG THƯ MỤC services/core_ocr
      - name: Build OCR Image (models included)
        if: steps.changes.outputs.ocr == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./services/core_ocr
          platforms: linux/amd64
          load: true
          tags: ghcr.io/tritruong666/picare-core-ocr:latest
          cache-from: type=gha,scope=core-ocr
          cache-to: type=gha,mode=max,scope=core-ocr

      - name: Test OCR offline before publishing
        if: steps.changes.outputs.ocr == 'true'
        run: |
          docker run --rm --network none -v "$PWD/services/core_ocr/tests:/app/tests:ro" ghcr.io/tritruong666/picare-core-ocr:latest python -m unittest discover -s tests -v
          docker run --rm --network none -v "$PWD/services/core_ocr/tests:/app/tests:ro" ghcr.io/tritruong666/picare-core-ocr:latest python -m tests.smoke_inference

      - name: Publish tested OCR Image
        if: steps.changes.outputs.ocr == 'true'
        run: docker push ghcr.io/tritruong666/picare-core-ocr:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # --- BƯỚC QUAN TRỌNG: Phải lấy code về máy ảo này thì mới có file để copy ---
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare VPS directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p ~/projects/picare-hub/server/hub

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/projects/picare-hub/server/hub"
          strip_components: 0

      - name: Create .env file on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.PICARE_HUB_PRODUCTION_ENV }}" > ~/projects/picare-hub/server/hub/.env

      - name: Create seed file on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p ~/projects/picare-hub/server/hub/src/seeds/local_data
            echo '${{ secrets.PICARE_USER_SEED_JSON }}' > ~/projects/picare-hub/server/hub/src/seeds/local_data/user_seed_data.json
            echo '${{ secrets.PICARE_HUB_CLIENT_SEED_JSON }}' > ~/projects/picare-hub/server/hub/src/seeds/local_data/hub_client_seed_data.json

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd ~/projects/picare-hub/server/hub
            # Lưu ý: GITHUB_TOKEN chỉ có hiệu lực khi job đang chạy
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
