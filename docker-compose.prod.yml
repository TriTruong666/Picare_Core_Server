services:
  core-ocr:
    image: ghcr.io/tritruong666/picare-core-ocr:latest
    restart: unless-stopped
    environment:
      CORE_OCR_SERVICE_TOKEN: ${CORE_OCR_SERVICE_TOKEN:-}
      GRPC_STORAGE_SERVICE_TOKEN: ${GRPC_STORAGE_SERVICE_TOKEN:-}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-2}
      OCR_REQUEST_TIMEOUT_SECONDS: ${OCR_REQUEST_TIMEOUT_SECONDS:-75}
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /home/ocr/.paddlex:size=32m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks:
      - picare-network

  picare-hub-server:
    image: ghcr.io/tritruong666/picare-hub-server:latest
    container_name: picare-hub-server
    restart: always
    env_file:
      - .env
    environment:
      - MAX_FILE_UPLOAD_MB=${MAX_FILE_UPLOAD_MB:-2048}
      - AUTH_LOGIN_VERIFICATION_ENABLED=${AUTH_LOGIN_VERIFICATION_ENABLED:-true}
      - CORE_OCR_URL=http://core-ocr:8010
      - AUTH_LOGIN_RATE_LIMIT_ENABLED=${AUTH_LOGIN_RATE_LIMIT_ENABLED:-true}
      - AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS=${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      - AUTH_LOGIN_RATE_LIMIT_MAX_PER_IP=${AUTH_LOGIN_RATE_LIMIT_MAX_PER_IP:-50}
      - AUTH_LOGIN_RATE_LIMIT_MAX_PER_ACCOUNT=${AUTH_LOGIN_RATE_LIMIT_MAX_PER_ACCOUNT:-10}
      - AUTH_TRUSTED_IP_TTL_DAYS=${AUTH_TRUSTED_IP_TTL_DAYS:-30}
      - AUTH_TRUSTED_IP_MAX_RECORDS=${AUTH_TRUSTED_IP_MAX_RECORDS:-10}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - S3_UPLOAD_STAGING_DIR=/app/tmp/s3-uploads
      - S3_UPLOAD_CONCURRENCY=${S3_UPLOAD_CONCURRENCY:-4}
      - S3_UPLOAD_LOCK_DURATION_MS=${S3_UPLOAD_LOCK_DURATION_MS:-120000}
      - S3_UPLOAD_TIMEOUT_MS=${S3_UPLOAD_TIMEOUT_MS:-600000}
      - CORE_STORAGE_WORKERS_EXTERNAL=true
    volumes:
      - ./src/seeds/local_data:/app/src/seeds/local_data
      - picare-s3-upload-staging:/app/tmp/s3-uploads
    networks:
      - picare-network
      - web_network

  picare-storage-small-worker:
    image: ghcr.io/tritruong666/picare-hub-server:latest
    container_name: picare-storage-small-worker
    restart: always
    command: ["node", "worker.js"]
    env_file:
      - .env
    environment:
      - CORE_STORAGE_WORKER_MODE=small
      - S3_UPLOAD_CONCURRENCY=${S3_UPLOAD_CONCURRENCY:-4}
      - S3_UPLOAD_TIMEOUT_MS=${S3_UPLOAD_TIMEOUT_MS:-600000}
      - S3_UPLOAD_LOCK_DURATION_MS=${S3_UPLOAD_LOCK_DURATION_MS:-120000}
      - S3_UPLOAD_STAGING_DIR=/app/tmp/s3-uploads
    volumes:
      - picare-s3-upload-staging:/app/tmp/s3-uploads
    networks:
      - picare-network

  picare-storage-video-worker:
    image: ghcr.io/tritruong666/picare-hub-server:latest
    container_name: picare-storage-video-worker
    restart: always
    command: ["node", "worker.js"]
    env_file:
      - .env
    environment:
      - CORE_STORAGE_WORKER_MODE=video
      - S3_VIDEO_UPLOAD_CONCURRENCY=${S3_VIDEO_UPLOAD_CONCURRENCY:-2}
      - S3_UPLOAD_TIMEOUT_MS=${S3_UPLOAD_TIMEOUT_MS:-600000}
      - S3_UPLOAD_LOCK_DURATION_MS=${S3_UPLOAD_LOCK_DURATION_MS:-120000}
    networks:
      - picare-network

  picare-storage-merge-worker:
    image: ghcr.io/tritruong666/picare-hub-server:latest
    container_name: picare-storage-merge-worker
    restart: always
    command: ["node", "worker.js"]
    env_file:
      - .env
    environment:
      - CORE_STORAGE_WORKER_MODE=merge
      - S3_MERGE_CONCURRENCY=${S3_MERGE_CONCURRENCY:-1}
      - S3_UPLOAD_TIMEOUT_MS=${S3_UPLOAD_TIMEOUT_MS:-600000}
    networks:
      - picare-network

networks:
  picare-network:
    external: true
  web_network:
    external: true

volumes:
  picare-s3-upload-staging:
