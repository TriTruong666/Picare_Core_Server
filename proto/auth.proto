syntax = "proto3";

package auth;

service AuthService {
  // Xác thực token và trả về thông tin user
  rpc VerifyToken (VerifyTokenRequest) returns (VerifyTokenResponse) {}

  // Kiểm tra quyền hạn (Authorize)
  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse) {}

  // Lấy danh sách user để các service chọn userId tham chiếu.
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse) {}

  // Kiểm tra userId còn tồn tại trước khi lưu tham chiếu.
  rpc GetUser (GetUserRequest) returns (GetUserResponse) {}
  rpc GetUsersByIds (GetUsersByIdsRequest) returns (GetUsersByIdsResponse) {}
}

message VerifyTokenRequest {
  string token = 1;
}

message VerifyTokenResponse {
  bool valid = 1;
  string userId = 2;
  string name = 3;
  string role = 4;
}

message CheckPermissionRequest {
  string userId = 1;
  string permission = 2;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 limit = 2;
  string search = 3;
  string role = 4;
}

message HubUser {
  string userId = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string role = 5;
  bool isOnline = 6;
  string note = 7;
}

message ListUsersResponse {
  repeated HubUser users = 1;
  int32 totalRecords = 2;
  int32 totalPages = 3;
  int32 currentPage = 4;
  int32 pageSize = 5;
}

message GetUserRequest {
  string userId = 1;
}

message GetUserResponse {
  bool found = 1;
  HubUser user = 2;
}

message GetUsersByIdsRequest { repeated string userIds = 1; }
message GetUsersByIdsResponse { repeated HubUser users = 1; repeated string missingUserIds = 2; }

service LicenseService {
  // Lấy trạng thái kích hoạt của client và danh sách các tính năng được mở khóa
  rpc GetLicenseConfig (LicenseConfigRequest) returns (LicenseConfigResponse) {}
  rpc CheckLicense (LicenseConfigRequest) returns (LicenseConfigResponse) {}
  rpc CreateTicket (CreateTicketRequest) returns (TicketResponse) {}
  rpc ListTickets (ListTicketsRequest) returns (ListTicketsResponse) {}
  rpc GetTicket (GetTicketRequest) returns (TicketResponse) {}
}

message LicenseConfigRequest {
  string licenseKey = 1;
  string softwareId = 2;
}

message LicenseConfigResponse {
  bool active = 1;
  string status = 2; // e.g. "active", "inactive"
  repeated string enabledFeatures = 3; // e.g. ["s3", "mail", "chat"]
  string message = 4;
  string customerName = 5;
  string softwareName = 6;
  string licenseId = 7;
}

message CreateTicketRequest {
  string licenseId = 1;
  string licenseKey = 2;
  string title = 3;
  string message = 4;
  repeated string attachments = 5;
  string status = 6;
  string cancelReason = 7;
  string note = 8;
}

message ListTicketsRequest {
  string licenseId = 1;
  string licenseKey = 2;
  int32 page = 3;
  int32 limit = 4;
  string search = 5;
  string status = 6;
}

message GetTicketRequest {
  string licenseId = 1;
  string licenseKey = 2;
  string ticketId = 3;
}

message Ticket {
  string id = 1;
  string licenseId = 2;
  string title = 3;
  string message = 4;
  repeated string attachments = 5;
  string status = 6;
  string cancelReason = 7;
  string note = 8;
  string createdAt = 9;
  string updatedAt = 10;
}

message TicketResponse {
  bool success = 1;
  string message = 2;
  Ticket ticket = 3;
}

message ListTicketsResponse {
  bool success = 1;
  string message = 2;
  repeated Ticket tickets = 3;
  int32 totalRecords = 4;
  int32 totalPages = 5;
  int32 currentPage = 6;
  int32 pageSize = 7;
}

service S3Service {
  rpc QueueUpload (S3UploadRequest) returns (S3UploadJobResponse) {}
  rpc GetUploadJob (S3UploadJobRequest) returns (S3UploadJobStatusResponse) {}
  rpc DownloadObject (S3ObjectRequest) returns (stream S3DownloadChunk) {}
  rpc GetObjectMetadata (S3ObjectRequest) returns (S3ObjectMetadataResponse) {}
  rpc DeleteObject (S3ObjectRequest) returns (S3DeleteObjectResponse) {}
}

service MailService {
  rpc SendOfficeInvitationMail (OfficeInvitationMailRequest) returns (MailSendResponse) {}
  rpc SendOrderReturnSigningMail (OrderReturnSigningMailRequest) returns (MailSendResponse) {}
}

message OfficeInvitationMailRequest {
  string to = 1;
  string recipientName = 2;
  string companyName = 3;
  string accountEmail = 4;
  string actionUrl = 5;
  string expiresAt = 6;
}

message OrderReturnSigningMailRequest {
  string to = 1;
  string signerName = 2;
  string returnId = 3;
  string orderId = 4;
  string actionUrl = 5;
  string expiresAt = 6;
}

message MailSendResponse {
  bool success = 1;
  string message = 2;
  string messageId = 3;
}

message S3UploadRequest {
  bytes file = 1;
  string mimeType = 2;
  string originalName = 3;
  int64 fileSize = 4;
  string folder = 5;
  string clientId = 6;
  string uploadedBy = 7;
  string description = 8;
  string visibility = 9;
}

message S3UploadJobResponse {
  bool success = 1;
  string message = 2;
  string jobId = 3;
  string key = 4;
  string status = 5;
}

message S3UploadJobRequest {
  string jobId = 1;
}

message S3UploadResult {
  string key = 1;
  string url = 2;
  string etag = 3;
  string recordId = 4;
  bool reused = 5;
}

message S3UploadJobStatusResponse {
  bool success = 1;
  string message = 2;
  string jobId = 3;
  string status = 4;
  int32 progress = 5;
  bool shouldPoll = 6;
  S3UploadResult result = 7;
  string failedReason = 8;
}

message S3ObjectRequest {
  string key = 1;
}

message S3DownloadChunk {
  bytes data = 1;
  string contentType = 2;
  int64 contentLength = 3;
  string etag = 4;
}

message S3ObjectMetadataResponse {
  string key = 1;
  string contentType = 2;
  int64 contentLength = 3;
  string lastModified = 4;
  map<string, string> metadata = 5;
  string etag = 6;
}

message S3DeleteObjectResponse {
  bool success = 1;
  bool deletedRecord = 2;
}

service ChatService {
  // Tạo hoặc lấy hội thoại 1-1 / nhóm theo ngữ cảnh nghiệp vụ (Office, SFA, WMS, OMS)
  rpc EnsureConversation (EnsureConversationRequest) returns (ChatConversationResponse) {}

  // Gửi tin nhắn văn bản, file đính kèm hoặc Entity Card từ các repo sang Core Hub
  rpc SendMessage (GrpcSendMessageRequest) returns (ChatMessageResponse) {}

  // Gửi nhanh thẻ nghiệp vụ (Đơn hàng SFA/OMS, Phiếu kho WMS, Đơn duyệt chi Office)
  rpc SendEntityMessage (SendEntityMessageRequest) returns (ChatMessageResponse) {}

  // Cập nhật trạng thái trực tiếp trên Entity Card khi đơn hàng/chứng từ đổi trạng thái
  rpc UpdateEntityCardSnapshot (UpdateEntityCardSnapshotRequest) returns (UpdateEntityCardSnapshotResponse) {}

  // Lấy tổng số tin chưa đọc & danh sách hội thoại rút gọn cho Dropdown UI / Header Badge
  rpc GetUserChatSummary (UserChatSummaryRequest) returns (UserChatSummaryResponse) {}

  // Đồng bộ danh sách thành viên vào nhóm chat phòng ban/đội bán hàng
  rpc SyncConversationMembers (SyncConversationMembersRequest) returns (SyncConversationMembersResponse) {}

  // Thu hồi tin nhắn
  rpc RecallMessage (RecallMessageRequest) returns (RecallMessageResponse) {}

  // Xoá tin nhắn ở phía tôi
  rpc DeleteMessageForMe (DeleteMessageForMeRequest) returns (DeleteMessageForMeResponse) {}
}

message EnsureConversationRequest {
  string creatorId = 1;
  string type = 2; // "private" | "group"
  string name = 3;
  string avatarUrl = 4;
  repeated string memberIds = 5;
  string scopeSystem = 6; // "CORE" | "OFFICE" | "OMS" | "WMS" | "SFA"
  string companyId = 7;
  string contextType = 8; // "DEPARTMENT" | "COMPANY_GENERAL" | "SALE_TEAM" | "ORDER"...
  string contextId = 9;
}

message ChatConversationResponse {
  bool success = 1;
  string message = 2;
  string conversationId = 3;
  string conversationJson = 4;
}

message GrpcAttachmentInput {
  string fileName = 1;
  string fileUrl = 2;
  string s3AssetId = 3;
  string s3Key = 4;
  string fileType = 5;
  string mimeType = 6;
  int64 fileSize = 7;
  string thumbnailUrl = 8;
  int32 width = 9;
  int32 height = 10;
  string blurhash = 11;
  int32 durationMs = 12;
}

message GrpcSendMessageRequest {
  string conversationId = 1;
  string senderId = 2;
  string type = 3; // "text" | "image" | "file" | "system" | "entity_card" | "mixed"
  string content = 4;
  string replyToId = 5;
  string metadataJson = 6;
  string clientMessageId = 7;
  repeated GrpcAttachmentInput attachments = 8;
}

message SendEntityMessageRequest {
  string conversationId = 1;
  string senderId = 2;
  repeated string recipientIds = 3; // Nếu chưa có conversationId, tự động tạo/lấy hội thoại 1-1 hoặc nhóm
  string content = 4;
  string entityType = 5; // "SFA_ORDER" | "EXPENSE_REQUEST" | "WMS_SHIPPING" | "OMS_ECOM_ORDER"...
  string sourceSystem = 6; // "OFFICE" | "SFA" | "OMS" | "WMS"
  string entityId = 7;
  string entityCode = 8;
  string companyId = 9;
  string snapshotJson = 10;
  string navigationPath = 11;
  string primarySystem = 12;
  string fallbackPathsJson = 13;
  string clientMessageId = 14;
}

message ChatMessageResponse {
  bool success = 1;
  string message = 2;
  string conversationId = 3;
  string messageId = 4;
  string messageJson = 5;
}

message UpdateEntityCardSnapshotRequest {
  string conversationId = 1;
  string messageId = 2;
  string entityType = 3;
  string entityId = 4;
  string sourceSystem = 5;
  string snapshotPatchJson = 6;
  string navigationPatchJson = 7;
}

message UpdateEntityCardSnapshotResponse {
  bool success = 1;
  string message = 2;
  int32 updatedCount = 3;
  repeated string updatedMessageIds = 4;
}

message UserChatSummaryRequest {
  string userId = 1;
  int32 limit = 2;
  string scopeSystem = 3;
  string companyId = 4;
}

message UserChatSummaryResponse {
  bool success = 1;
  string userId = 2;
  int32 totalUnreadMessages = 3;
  int32 totalMentionCount = 4;
  int32 unreadConversationsCount = 5;
  int32 totalConversations = 6;
  string summaryJson = 7;
}

message SyncConversationMembersRequest {
  string conversationId = 1;
  repeated string memberIds = 2;
  string mode = 3; // "REPLACE" | "ADD_ONLY" | "REMOVE_ONLY"
}

message SyncConversationMembersResponse {
  bool success = 1;
  string conversationId = 2;
  repeated string addedUserIds = 3;
  repeated string removedUserIds = 4;
}

message RecallMessageRequest {
  string messageId = 1;
  string userId = 2;
}

message RecallMessageResponse {
  bool success = 1;
  string message = 2;
  string messageId = 3;
}

message DeleteMessageForMeRequest {
  string messageId = 1;
  string userId = 2;
}

message DeleteMessageForMeResponse {
  bool success = 1;
  string message = 2;
  string messageId = 3;
}
